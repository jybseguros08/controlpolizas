services:
  - type: web
    name: control-polizas
    runtime: python
    plan: free
    buildCommand: "uv sync --locked --no-dev --no-install-project"
    startCommand: "uv run --no-sync gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
